appId: com.chewgather.app
name: "ISSUE-001: RSVP deadline must be before event date"
tags:
  - issue-001
  - plans
  - regression
---
# Regression for issue #1: an RSVP deadline must fall before the event date.
#
# The RSVP Deadline picker was redesigned (issue #98): invalid deadline options
# (a window that would land after the event) can no longer be selected — tapping
# one shakes the chip instead of selecting it. The "select invalid → submit →
# blocked" path is therefore unreachable through the UI; the guarantee is now
# enforced at selection time. This flow verifies the positive path: a valid
# deadline lets plan creation proceed with no RSVP-deadline error.

- launchApp
- waitForAnimationToEnd

# Navigate to plan creation from Home
- tapOn: "Home, tab, 1 of 5"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Home, tab, 1 of 5"
    timeout: 30000

# "plan-later-btn" is GONE. Plan a Feast row on MenuTent (testID: menu-tent-feast) → /plan-event
- tapOn:
    id: "menu-tent-feast"
- waitForAnimationToEnd
- takeScreenshot: "issue-001-plan-form-open"

# Enter a plan title
- tapOn:
    id: "plan-title-input"
    optional: true
- runFlow:
    when:
      visible: "e.g. Friday Night Dinner"
    commands:
      - tapOn: "e.g. Friday Night Dinner"
- inputText: "Test Deadline Plan"

# Select a future event date (Tomorrow) and a time
- tapOn: "Tomorrow"
- takeScreenshot: "issue-001-date-selected"
- tapOn:
    text: "7:00 PM"
    optional: true

# Scroll to the RSVP Deadline section
- scrollUntilVisible:
    element:
      text: "RSVP Deadline"
    direction: DOWN
- assertVisible: "RSVP Deadline"

# Select a valid deadline. "12h before" is always valid for a Tomorrow event
# (the deadline lands ~12h before the event, comfortably in the future).
- tapOn: "12h before"
- takeScreenshot: "issue-001-valid-deadline-selected"

# Create the plan — a valid deadline must let creation proceed.
- scrollUntilVisible:
    element:
      id: "create-plan-btn"
    direction: DOWN
- tapOn:
    id: "create-plan-btn"
- waitForAnimationToEnd

# Regression assertion: no RSVP-deadline validation error appears.
- assertNotVisible: "RSVP deadline passed"
- assertNotVisible: "Invalid RSVP Deadline"
- takeScreenshot: "issue-001-plan-created"
