appId: org.name.ChewablQuickDiningPicks
name: "Restaurant Detail — View details, favorite, and reserve"
tags:
  - discover
  - restaurant
  - full
---
- launchApp
- waitForAnimationToEnd

# Stabilize tab bar by tapping Home first
- tapOn: "Home, tab, 1 of 5"
- waitForAnimationToEnd

# Navigate to Discover tab
- tapOn: "Discover, tab, 2 of 5"
- waitForAnimationToEnd
- takeScreenshot: "12-discover-screen"

# Discover auto-syncs the user's saved cuisine/budget preferences into the filter
# bar (the "N" badge on the filter button). Those filters constrain a search and
# can collapse it to "No restaurants found". Reset both to "All" so the search is
# deterministic. (cuisine-chip-all → setSelectedCuisines([]) + pins
# userChangedFilters so prefs don't re-sync over the reset.)
- tapOn:
    id: "filter-btn"
- waitForAnimationToEnd
- tapOn:
    id: "cuisine-chip-all"
- tapOn:
    id: "budget-chip-all"
    optional: true
- tapOn:
    id: "filter-btn"
- waitForAnimationToEnd

# Search for restaurants to populate results
- tapOn:
    text: "Search restaurants, cuisines..."
    optional: true
- tapOn:
    id: "search-input"
    optional: true
- inputText: "pizza"
- waitForAnimationToEnd
- pressKey: Enter       # dismiss keyboard (occludes lower cards); hideKeyboard is flaky on iOS
- waitForAnimationToEnd
- takeScreenshot: "12-discover-search-results"

# Open the first result. Gate on the card testID, not a "Pizza" text match — the
# old text gate could silently skip the entire flow when results loaded slowly,
# or match a keyboard autocomplete suggestion with no card behind it.
- extendedWaitUntil:
    visible:
      id: "restaurant-card-.*"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "restaurant-card-.*"
    commands:
      - tapOn:
          id: "restaurant-card-.*"
      - waitForAnimationToEnd
      - takeScreenshot: "12-restaurant-detail"

      # Tap the favorite/heart button using accessibility label
      - runFlow:
          when:
            visible: "Add to favorites"
          commands:
            - tapOn: "Add to favorites"
            - takeScreenshot: "12-favorite-toggled"

      - runFlow:
          when:
            visible: "Remove from favorites"
          commands:
            - tapOn: "Remove from favorites"
            - takeScreenshot: "12-unfavorite-toggled"

      # Look for "Plan a Dinner" / reserve button
      - runFlow:
          when:
            visible:
              id: "reserve-btn"
          commands:
            - tapOn:
                id: "reserve-btn"
            - waitForAnimationToEnd
            - takeScreenshot: "12-reserve-action"
            - pressKey: back
            - waitForAnimationToEnd

      # Navigate back to Discover
      - pressKey: back
      - waitForAnimationToEnd

- takeScreenshot: "12-returned-to-discover"
