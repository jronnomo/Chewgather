appId: com.chewgather.app
name: "Auth — Sign in with seed user"
tags:
  - auth
  - full
---
# Launch fresh. NOTE: clearState does NOT clear the persisted auth session
# (LESSONS-LEARNED #4 — the token survives), so a previous run can leave us
# signed in on Home. We sign out first (below) to reliably reach the auth screen.
- launchApp:
    appId: com.chewgather.app
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd  # Double wait required after clearState (cold start)

# Dismiss iOS "Save Password?" dialog if it lingers from a prior run
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd

# Sign-out-first: if we landed on Home (persisted session), sign out so the
# rest of the flow exercises the real login path and reaches the auth screen.
- runFlow:
    when:
      visible: "Home, tab, 1 of 5"
    commands:
      - takeScreenshot: "01-auth-already-signed-in"
      - tapOn: "Home, tab, 1 of 5"
      - waitForAnimationToEnd
      - tapOn: "Profile, tab, 5 of 5"
      - waitForAnimationToEnd
      - tapOn: "Profile, tab, 5 of 5"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Sign Out"
          direction: DOWN
          timeout: 10000
      - tapOn: "Sign Out"
      - waitForAnimationToEnd
      - waitForAnimationToEnd  # sign-out Chomp transition → /auth

# Wait for the auth screen to render
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 30000

- takeScreenshot: "01-auth-screen"

# Sign in as Alice
- runFlow:
    when:
      visible: "Email address"
    commands:
      - tapOn:
          text: "Email address"
      - inputText: "alice@chewabl.dev"
      - tapOn:
          text: "Password"
      - inputText: "seed1234"
      - takeScreenshot: "01-auth-filled"
      # The keyboard occludes the "Sign In Button" submit; dismiss it by tapping
      # the logo area (blurs the password field) before tapping submit.
      - tapOn:
          point: "50%,22%"
      - waitForAnimationToEnd
      - tapOn: "Sign In Button"
      - waitForAnimationToEnd

      # Dismiss the iOS "Save Password?" dialog — appears a beat after submit.
      - extendedWaitUntil:
          visible: "Not Now"
          timeout: 6000
          optional: true
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
            - waitForAnimationToEnd

      # Handle onboarding if it appears (account with no saved preferences).
      # Conditional repeat covers a variable number of onboarding steps.
      - repeat:
          times: 6
          commands:
            - runFlow:
                when:
                  visible:
                    id: "onboarding-next-btn"
                commands:
                  - tapOn:
                      id: "onboarding-next-btn"
                  - waitForAnimationToEnd

      # Stable post-login signal: the authenticated tab bar (greeting text
      # rotates — e.g. "Reservations for one craving, <name>?" — so it is not a
      # reliable anchor).
      - extendedWaitUntil:
          visible: "Home, tab, 1 of 5"
          timeout: 25000
      - takeScreenshot: "01-auth-signed-in"
