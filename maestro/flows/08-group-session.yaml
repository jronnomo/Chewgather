appId: org.name.ChewablQuickDiningPicks
name: "Group Session — Start a session and verify lobby UI"
tags:
  - group-session
  - full
---
- launchApp
- waitForAnimationToEnd
- tapOn: "Home, tab, 1 of 5"
- waitForAnimationToEnd

# Wait for Home screen to fully hydrate (auth + data load)
- extendedWaitUntil:
    visible: "Home, tab, 1 of 5"
    timeout: 30000

- takeScreenshot: "08-home-initial"

# Tap Group Chomp row on MenuTent (testID: menu-tent-chomp) → /group-session
# "group-swipe-btn" is GONE — replaced by the MenuTent action surface
- tapOn:
    id: "menu-tent-chomp"
- waitForAnimationToEnd
- takeScreenshot: "08-group-session-screen"

# Verify lobby elements exist (2+ members required to start)
- runFlow:
    when:
      visible: "Add Person"
    commands:
      - assertVisible: "Add Person"
      - takeScreenshot: "08-group-lobby-elements"

# Verify Start Swiping button is visible (may be disabled without 2+ members)
- runFlow:
    when:
      visible:
        id: "start-swiping-btn"
    commands:
      - assertVisible:
          id: "start-swiping-btn"
      - takeScreenshot: "08-group-start-swiping-visible"
