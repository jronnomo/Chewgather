appId: com.chewgather.app
name: "Friends — Navigate to Friends and send a request"
tags:
  - friends
  - full
---
- launchApp
- waitForAnimationToEnd

# Navigate directly to Friends tab
- tapOn: "Friends, tab, 4 of 5"
- waitForAnimationToEnd
- takeScreenshot: "06-friends-screen"

# Check the three tabs: Friends, Requests, Add
- runFlow:
    when:
      visible: "Requests"
    commands:
      - tapOn: "Requests"
      - takeScreenshot: "06-friends-requests-tab"

      # Check for Accept/Decline buttons when friend requests exist
      - runFlow:
          when:
            visible: "Accept friend request"
          commands:
            - assertVisible: "Accept friend request"
            - assertVisible: "Decline friend request"
            - takeScreenshot: "06-friends-request-actions"

- runFlow:
    when:
      visible: "Add"
    commands:
      - tapOn: "Add"
      - takeScreenshot: "06-friends-add-tab"

# Try entering an invite code (use a known invalid one to test 404 path)
- runFlow:
    when:
      visible: "Enter Invite Code"
    commands:
      - tapOn: "e.g. AB3K9X2M"
      - inputText: "ZZZZZZ"
      - tapOn: "Look up invite code"
      - waitForAnimationToEnd
      # "Not Found" alert from the invalid code
      - tapOn:
          text: "OK"
          optional: true
      - takeScreenshot: "06-friends-add-attempt"
