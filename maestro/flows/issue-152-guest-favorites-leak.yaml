appId: org.name.ChewablQuickDiningPicks
name: "ISSUE-152: a guest must not inherit a previous account's favorites"
tags:
  - issue-152
  - guest
  - privacy
  - regression
---
# Regression for the cross-user favorites leak (commit 69cd362):
# FAVORITES_KEY is a single global AsyncStorage key. After an account user
# favorites a restaurant and signs out, a guest signing in on the same device
# must NOT inherit that favorite.
#
# Strategy: sign in as seeded alice, open a restaurant detail and ensure it is
# favorited (writes FAVORITES_KEY), sign out, continue as guest, open the SAME
# restaurant detail, and assert the heart reads "Add to favorites" — i.e. the
# guest does not see the account's favorite.

# ── Phase 1: sign in as alice ───────────────────────────────────────────────
- launchApp:
    appId: org.name.ChewablQuickDiningPicks
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd

# If already signed in from a prior run, sign out first
- runFlow:
    when:
      visible: "Profile, tab, 5 of 5"
    commands:
      - tapOn: "Profile, tab, 5 of 5"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Sign Out"      # btn view is tab-bar-clipped; scroll to the text node
          direction: DOWN
          timeout: 10000
          centerElement: false
      - tapOn:
          id: "profile-sign-out-btn"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Email address"
    timeout: 30000
- tapOn:
    text: "Email address"
- inputText: "alice@chewabl.dev"
- tapOn:
    text: "Password"
- inputText: "seed1234"
- tapOn:
    point: "50%,22%"     # dismiss keyboard (occludes Sign In Button)
- waitForAnimationToEnd
- tapOn: "Sign In Button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Home, tab, 1 of 5"
    timeout: 30000

# ── Phase 2: open the first Discover restaurant, ensure it is favorited ─────
- tapOn: "Discover, tab, 2 of 5"
- waitForAnimationToEnd
- tapOn: "Discover, tab, 2 of 5"     # double-tap: tab nav is flaky (LESSONS #5);
- waitForAnimationToEnd              # a single tap can leave us on Home.
- extendedWaitUntil:
    visible:
      id: "restaurant-card-.*"
    timeout: 30000
- tapOn:
    id: "restaurant-card-.*"
- waitForAnimationToEnd
# If the card tap didn't navigate (still on the Discover list), tap again.
- runFlow:
    when:
      visible:
        id: "restaurant-card-.*"
    commands:
      - tapOn:
          id: "restaurant-card-.*"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Add to favorites|Remove from favorites"
    timeout: 20000

# Tap the heart; if it was already favorited from seed we just un-favorited it,
# so tap again. End state: definitely favorited → FAVORITES_KEY is non-empty.
- tapOn:
    text: "Add to favorites|Remove from favorites"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Add to favorites"
    commands:
      - tapOn: "Add to favorites"
      - waitForAnimationToEnd
- assertVisible: "Remove from favorites"
- takeScreenshot: "152leak-alice-favorited"

# ── Phase 3: sign out ───────────────────────────────────────────────────────
# We favorited from the restaurant DETAIL page, which is a pushed screen with no
# tab bar — back out to the tabbed shell before navigating to Profile. iOS has no
# hardware back, so pressKey:back is a no-op here; tap the detail's "Go back"
# arrow (accessibilityLabel) instead.
- tapOn: "Go back"
- waitForAnimationToEnd
- tapOn: "Profile, tab, 5 of 5"
- waitForAnimationToEnd
- tapOn: "Profile, tab, 5 of 5"     # double-tap: tab nav is flaky (LESSONS #5);
- waitForAnimationToEnd             # a single tap can leave us on the prior tab.
- scrollUntilVisible:
    element:
      text: "Sign Out"      # btn view is tab-bar-clipped; scroll to the text node
    direction: DOWN
    timeout: 10000
    centerElement: false
- tapOn:
    id: "profile-sign-out-btn"
- waitForAnimationToEnd

# ── Phase 4: continue as guest ──────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Continue without an account"
    timeout: 30000
- tapOn: "Continue without an account"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "onboarding-next-btn"
    commands:
      # Step 0 → step 1 (cuisine picker)
      - tapOn:
          id: "onboarding-next-btn"
      - waitForAnimationToEnd
      # Step 1 requires ≥1 cuisine before Next enables (post-#165). Pick
      # Italian, then mash through the remaining defaults-driven steps.
      - tapOn: "Italian"
      - waitForAnimationToEnd
      - repeat:
          times: 5
          commands:
            - tapOn:
                id: "onboarding-next-btn"
                optional: true
            - waitForAnimationToEnd
# Greeting text is "Welcome to Chewgether 🍴" — emoji suffix requires regex
- extendedWaitUntil:
    visible: "Welcome to Chewgether.*"
    timeout: 30000

# ── Phase 5: open a restaurant — heart must NOT show favorited ───────────────
- tapOn: "Discover, tab, 2 of 5"
- waitForAnimationToEnd
- tapOn: "Discover, tab, 2 of 5"     # double-tap: tab nav is flaky (LESSONS #5);
- waitForAnimationToEnd              # a single tap can leave us on Home.
# A guest has no saved location, so Discover shows a "We need your location"
# gate instead of the list. Enable it (and grant the iOS permission if the
# system sheet appears) so restaurants load. The leak check only needs ANY
# restaurant detail — the guest's favorites store is separate and empty.
- runFlow:
    when:
      visible: "Enable location"
    commands:
      - tapOn: "Enable location"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Allow While Using App"
          commands:
            - tapOn: "Allow While Using App"
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "restaurant-card-.*"
    timeout: 30000
- tapOn:
    id: "restaurant-card-.*"
- waitForAnimationToEnd
# Retry if the card tap didn't navigate (still on the Discover list).
- runFlow:
    when:
      visible:
        id: "restaurant-card-.*"
    commands:
      - tapOn:
          id: "restaurant-card-.*"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Add to favorites"
    timeout: 20000
- takeScreenshot: "152leak-guest-detail"

# REGRESSION: the guest must see an UN-favorited heart. If the leak is back,
# the guest inherits alice's favorite and the heart reads "Remove from favorites".
- assertVisible: "Add to favorites"
- assertNotVisible: "Remove from favorites"
