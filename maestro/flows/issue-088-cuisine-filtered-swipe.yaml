appId: org.name.ChewablQuickDiningPicks
name: "ISSUE-088: Cuisine-filtered swipe deck loads successfully"
tags:
  - issue-088
  - swipe
  - cuisine
  - regression
---
- launchApp
- waitForAnimationToEnd

# If on auth screen, sign in as Alice (standalone run after reseed)
- runFlow:
    when:
      visible: "Email address"
    commands:
      - tapOn:
          text: "Email address"
      - inputText: "alice@chewabl.dev"
      - tapOn:
          text: "Password"
      - inputText: "seed1234"
      - tapOn: "Sign In Button"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
            - waitForAnimationToEnd
      # Handle onboarding if it appears
      - runFlow:
          when:
            visible:
              id: "onboarding-next-btn"
          commands:
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd

# Stabilize tab bar by tapping Home first
- tapOn: "Home, tab, 1 of 5"
- waitForAnimationToEnd

# Navigate to Plans tab (double-tap for reliability)
- tapOn: "Plans, tab, 3 of 5"
- waitForAnimationToEnd
- tapOn: "Plans, tab, 3 of 5"
- waitForAnimationToEnd

- takeScreenshot: "issue-088-plans-tab"

# Target "Jerry's Pizza Night" — voting plan, cuisine: Italian, Jerry owns,
# Alice is an accepted invitee with NO pre-cast votes (`votes: new Map()` in
# the seed), so entering puts her into the swipe deck. Tests the strict
# cuisine filtering + radius expansion code path.
#
# Plan cards are grouped accessibility elements — text matching against the
# title needs the regex `.*Pizza Night.*` rather than a coordinate tap, so
# we don't accidentally land on whichever card happens to be mid-viewport
# (which is what bit us with the pre-voted Group Pick plans).
# Target Jerry's Pizza Night via the slug-suffixed testID. The slug rule
# drops apostrophes, so "Jerry's" → "jerry-s" — the testID becomes
# `plan-card-<id>-title-jerry-s-pizza-night`.
- scrollUntilVisible:
    element:
      id: "plan-card-.*-title-jerry-s-pizza-night"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 30
    centerElement: false
- takeScreenshot: "issue-088-plan-cards-visible"
- tapOn:
    id: "plan-card-.*-title-jerry-s-pizza-night"
- waitForAnimationToEnd

- takeScreenshot: "issue-088-swipe-deck-loading"

# Wait for the deck to load (restaurants fetched with cuisine filter + radius expansion)
- extendedWaitUntil:
    visible: "Pass on restaurant"
    timeout: 15000

- takeScreenshot: "issue-088-swipe-deck-loaded"

# Assert swipe card buttons are visible — confirms restaurants fetched, cuisine filter applied, deck rendered
- assertVisible: "Like restaurant"
- assertVisible: "Pass on restaurant"

# Swipe right (like) on the first card
- tapOn: "Like restaurant"
- waitForAnimationToEnd
- takeScreenshot: "issue-088-after-first-swipe"

# Swipe left (pass) on the second card
- tapOn: "Pass on restaurant"
- waitForAnimationToEnd
- takeScreenshot: "issue-088-after-second-swipe"
