appId: com.chewgather.app
name: "Guest Mode — Limited experience without account"
tags:
  - auth
  - guest
  - full
---
# Phase 1: Sign out if signed in (clears keychain auth token)
# If in guest mode already, skip sign-out — guest has no keychain token.
- launchApp
- waitForAnimationToEnd
- waitForAnimationToEnd          # double-wait: cold start / warm-resume tab bar (LESSONS #8)

# A guest ALSO has a Profile tab, but its profile screen is the "Create your
# account" upsell with no Sign Out. So gating sign-out on the Profile tab alone
# (and then scrolling for "Sign Out") fails when a prior flow left us as a guest
# — e.g. 15-onboarding ends in guest mode right before this flow in the suite.
- runFlow:
    when:
      visible: "Profile, tab, 5 of 5"
    commands:
      - tapOn: "Profile, tab, 5 of 5"
      - waitForAnimationToEnd
      - tapOn: "Profile, tab, 5 of 5"
      - waitForAnimationToEnd
      # Only sign out for a real signed-in user. The guest profile shows
      # "Create your account"; a signed-in profile does not — branch on it.
      - runFlow:
          when:
            notVisible: "Create your account"
          commands:
            # Scroll to the "Sign Out" TEXT node, not the profile-sign-out-btn
            # view: the button is clipped by the tab bar so its view never
            # reaches the visibility threshold, but its text label does.
            - scrollUntilVisible:
                element:
                  text: "Sign Out"
                direction: DOWN
                timeout: 10000
                centerElement: false
            - tapOn: "Sign Out"
            - waitForAnimationToEnd

# Phase 2: Stop app, clear state, relaunch
- stopApp
- clearState
- launchApp
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: "18-auth-screen"

# Handle iOS "Not Now" dialog
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd

# Assert guest mode option is visible
- assertVisible: "Continue without an account"

# Tap to continue as guest
- tapOn: "Continue without an account"
- waitForAnimationToEnd

# Handle any alert
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd

- takeScreenshot: "18-guest-entered"

# If onboarding appears, quickly tap through all steps. Onboarding step 1 is
# the cuisine picker, which now (post-#165) requires at least one selection
# before the Next button enables — so pick Italian on step 1 before
# proceeding.
- runFlow:
    when:
      visible:
        id: "onboarding-next-btn"
    commands:
      # Step 0 → 1
      - tapOn:
          id: "onboarding-next-btn"
      - waitForAnimationToEnd
      # Step 1 (cuisine) — pick Italian to enable Next
      - tapOn: "Italian"
      - waitForAnimationToEnd
      - tapOn:
          id: "onboarding-next-btn"
      - waitForAnimationToEnd
      - tapOn:
          id: "onboarding-next-btn"
      - waitForAnimationToEnd
      - tapOn:
          id: "onboarding-next-btn"
      - waitForAnimationToEnd
      - tapOn:
          id: "onboarding-next-btn"
      - waitForAnimationToEnd

- takeScreenshot: "18-guest-home"

# Guest mode only has 2 tabs: Home and Discover (Plans, Friends, Profile are hidden)
# Verify guest home screen content
# Greeting text is "Welcome to Chewgather 🍴" — emoji suffix requires regex
- assertVisible: "Welcome to Chewgather.*"
- assertVisible: "Sign In"

# Verify Discover tab works in guest mode
# Tab accessibility label varies with hidden tabs — use coordinate tap (right side of 2-tab bar)
- tapOn:
    point: "75%, 97%"
- waitForAnimationToEnd
- takeScreenshot: "18-guest-discover"

# Go back to Home via coordinate tap (tab label format varies)
- tapOn:
    point: "25%, 97%"
- waitForAnimationToEnd
- takeScreenshot: "18-guest-home-final"
- assertVisible: "Welcome to Chewgather.*"
