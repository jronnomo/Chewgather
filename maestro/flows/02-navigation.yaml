appId: com.chewgather.app
name: "Navigation — All 5 tabs accessible and render content"
tags:
  - navigation
  - full
---
- launchApp
- waitForAnimationToEnd

# If on auth screen (e.g. after reseed), sign in as Alice
- runFlow:
    when:
      visible: "Email address"
    commands:
      - tapOn:
          text: "Email address"
      - inputText: "alice@chewabl.dev"
      - tapOn:
          text: "Password"
      - inputText: "seed1234"
      - tapOn:
          point: "50%,22%"     # dismiss keyboard (occludes Sign In Button)
      - waitForAnimationToEnd
      - tapOn: "Sign In Button"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Not Now"
          timeout: 6000
          optional: true
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
            - waitForAnimationToEnd
      - repeat:
          times: 6
          commands:
            - runFlow:
                when:
                  visible:
                    id: "onboarding-next-btn"
                commands:
                  - tapOn:
                      id: "onboarding-next-btn"
                  - waitForAnimationToEnd

# Verify all 5 tab bar items are accessible
- assertVisible: "Home, tab, 1 of 5"
- assertVisible: "Discover, tab, 2 of 5"
- assertVisible: "Plans, tab, 3 of 5"
- assertVisible: "Friends, tab, 4 of 5"
- assertVisible: "Profile, tab, 5 of 5"

# Home tab
- tapOn: "Home, tab, 1 of 5"
- assertVisible: "Home, tab, 1 of 5"
- takeScreenshot: "02-tab-home"

# Discover tab
- tapOn: "Discover, tab, 2 of 5"
- takeScreenshot: "02-tab-discover"

# Plans tab
- tapOn: "Plans, tab, 3 of 5"
- takeScreenshot: "02-tab-plans"

# Profile tab
- tapOn: "Profile, tab, 5 of 5"
- assertVisible: "Profile"
- takeScreenshot: "02-tab-profile"
