appId: org.name.ChewablQuickDiningPicks
name: "ISSUE-002: Start Swiping after plan creation skips member-add lobby"
tags:
  - issue-002
  - plans
  - group-session
  - regression
---
- launchApp
- waitForAnimationToEnd

# Navigate to plan creation
- tapOn: "Home, tab, 1 of 5"
- waitForAnimationToEnd

# Wait for Home screen to fully hydrate (auth + data load)
- extendedWaitUntil:
    visible: "Home, tab, 1 of 5"
    timeout: 30000

# "plan-later-btn" is GONE. Plan a Feast row on MenuTent (testID: menu-tent-feast) → /plan-event
- tapOn:
    id: "menu-tent-feast"
- waitForAnimationToEnd

# Fill in minimal plan details
- runFlow:
    when:
      visible: "e.g. Friday Night Dinner"
    commands:
      - tapOn: "e.g. Friday Night Dinner"
- inputText: "Swipe Test Plan"
- tapOn: "Tomorrow"
# The plan form was redesigned (PRD #100): time chips live inside collapsible
# period buckets (Morning / Midday / Afternoon / Evening). The Midday bucket
# header is always visible at the top of the Time section — tap it to expand,
# then pick 12:00 PM (which is in Midday's times list). Use runFlow to
# guard against the case where Midday is already expanded (toggling would
# collapse it).
- runFlow:
    when:
      notVisible: "12:00 PM"
    commands:
      # The bucket header is a grouped accessibility element rendered with
      # accessibilityLabel="Midday, <count>" — Maestro searches the composite,
      # not the bare "Midday" text. The count varies with disabled-times so
      # match with a regex.
      - tapOn: "Midday, \\d+"
      - waitForAnimationToEnd
- tapOn: "12:00 PM"

# Scroll down to RSVP Deadline and set a valid deadline
- scrollUntilVisible:
    element:
      text: "12h before"
    direction: DOWN
- tapOn: "12h before"

- takeScreenshot: "issue-002-plan-form-filled"

# Create the plan (button label is "Cook Up This Plan"; tap via testID)
- scrollUntilVisible:
    element:
      id: "create-plan-btn"
    direction: DOWN
- tapOn:
    id: "create-plan-btn"
- waitForAnimationToEnd

# Dismiss RSVP validation error if it appears
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd

- takeScreenshot: "issue-002-after-create"

# Handle "Plan's in the Oven!" success overlay — tap "Let's Feast!" to dismiss.
# PlanSuccessOverlay (components/PlanSuccessOverlay.tsx) shows heading
# "Plan's in the Oven!" and a single CTA "Let's Feast!" (no "Later" button).
# For a voting plan this calls router.back() → returns to Home.
- extendedWaitUntil:
    visible: "Let's Feast!"
    timeout: 15000
- tapOn: "Let's Feast!"
- waitForAnimationToEnd

- takeScreenshot: "issue-002-after-create-final"

# REGRESSION CHECK: The "Add to Group" / member-picker modal must NOT appear
- assertNotVisible: "Add to Group"
- takeScreenshot: "issue-002-regression-check"
