appId: com.chewgather.app
name: "ISSUE-002: Start Swiping after plan creation skips member-add lobby"
tags:
  - issue-002
  - plans
  - group-session
  - regression
---
- launchApp
- waitForAnimationToEnd

# Navigate to plan creation
- tapOn: "Home, tab, 1 of 5"
- waitForAnimationToEnd

# Wait for Home screen to fully hydrate (auth + data load)
- extendedWaitUntil:
    visible: "Home, tab, 1 of 5"
    timeout: 30000

# "plan-later-btn" is GONE. Plan a Feast row on MenuTent (testID: menu-tent-feast) → /plan-event
- tapOn:
    id: "menu-tent-feast"
- waitForAnimationToEnd

# Fill in minimal plan details
- runFlow:
    when:
      visible: "e.g. Friday Night Dinner"
    commands:
      - tapOn: "e.g. Friday Night Dinner"
- inputText: "Swipe Test Plan"
# Dismiss the keyboard — it stays up after typing the name and occludes the
# lower half of the form (the Time section's Midday/Afternoon/Evening buckets
# sit behind it, so a tap on "Midday" lands on a keyboard key and the bucket
# never expands). `pressKey: Enter` reliably dismisses it on this single-line
# field (maestro's hideKeyboard is flaky on iOS; 17-plan-creation uses Enter).
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Tomorrow"
- waitForAnimationToEnd
# The plan form was redesigned (PRD #100): time chips live inside collapsible
# period buckets (Morning / Midday / Afternoon / Evening). Bring the Midday
# bucket into view, expand it if collapsed, then pick 12:00 PM.
- runFlow:
    when:
      notVisible: "12:00 PM"
    commands:
      # The bucket header is a grouped accessibility element whose composite
      # label is "Midday, <count>" (count varies with disabled times) — match
      # the full label with a regex; the bare "Midday" substring won't match.
      - scrollUntilVisible:
          element:
            text: "Midday, \\d+"
          direction: DOWN
          timeout: 10000
      - tapOn: "Midday, \\d+"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "12:00 PM"
    direction: DOWN
    timeout: 10000
- tapOn: "12:00 PM"

# Scroll down to RSVP Deadline and set a valid deadline
- scrollUntilVisible:
    element:
      text: "12h before"
    direction: DOWN
- tapOn: "12h before"

- takeScreenshot: "issue-002-plan-form-filled"

# Create the plan (button label is "Cook Up This Plan"; tap via testID)
- scrollUntilVisible:
    element:
      id: "create-plan-btn"
    direction: DOWN
- tapOn:
    id: "create-plan-btn"
- waitForAnimationToEnd

# Dismiss RSVP validation error if it appears
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd

- takeScreenshot: "issue-002-after-create"

# Handle "Plan Created!" success dialog — tap Later to stay in app
- runFlow:
    when:
      visible: "Later"
    commands:
      - tapOn: "Later"
      - waitForAnimationToEnd

# If presented with "Start Swipe" alert, tap it
- runFlow:
    when:
      visible: "Start Swipe"
    commands:
      - tapOn: "Start Swipe"

- takeScreenshot: "issue-002-after-create-final"

# REGRESSION CHECK: The "Add to Group" / member-picker modal must NOT appear
- assertNotVisible: "Add to Group"
- takeScreenshot: "issue-002-regression-check"
