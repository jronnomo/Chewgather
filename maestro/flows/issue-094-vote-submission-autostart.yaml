appId: com.chewgather.app
name: "ISSUE-094: Vote submission succeeds with autoStart (restaurantOptions safety net)"
tags:
  - issue-094
  - vote
  - group-session
  - regression
---
# Regression test for issue #94:
# Vote submission fails when autoStart bypasses lobby (restaurantOptions empty).
# Fix added a safety net in finishSwiping to populate restaurantOptions before submitSwipes.
#
# Uses seed plan "Weekend Brunch" — Alice owns, status voting, Maya+Liam already
# voted (plan2Votes), Alice hasn't voted → autoStart=true → swiping phase
# immediately. After Alice votes, all 3 members have voted → plan confirms →
# results screen.

- launchApp
- waitForAnimationToEnd

# If on auth screen, sign in as Alice
- runFlow:
    when:
      visible: "Email address"
    commands:
      - tapOn:
          text: "Email address"
      - inputText: "alice@chewabl.dev"
      - tapOn:
          text: "Password"
      - inputText: "seed1234"
      - tapOn:
          point: "50%,22%"     # dismiss keyboard (occludes Sign In Button)
      - waitForAnimationToEnd
      - tapOn: "Sign In Button"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Not Now"
          timeout: 6000
          optional: true
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
            - waitForAnimationToEnd
      # Handle onboarding if it appears
      - runFlow:
          when:
            visible:
              id: "onboarding-next-btn"
          commands:
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd
            - tapOn:
                id: "onboarding-next-btn"
            - waitForAnimationToEnd

# Stabilize tab bar
- tapOn: "Home, tab, 1 of 5"
- waitForAnimationToEnd

# Navigate to Plans tab (double-tap for reliability)
- tapOn: "Plans, tab, 3 of 5"
- waitForAnimationToEnd
- tapOn: "Plans, tab, 3 of 5"
- waitForAnimationToEnd

- takeScreenshot: "issue-094-plans-tab"

# "Weekend Brunch" is a voting plan where Maya+Liam voted but Alice hasn't
# → autoStart=true. PlanCard's accessibilityLabel is "title, status, date",
# so match the title with a regex (Maestro text matching is anchored).
# Scroll the Upcoming list until the card is on screen, then open it.
# Target Weekend Brunch via the slug-suffixed testID — `plan-card-<id>-title-weekend-brunch`.
# (PlanCard's accessibilityLabel collapses children, so the title text isn't
# searchable via Maestro's text selector — the testID is the reliable hook.)
# The Plans tab is a virtualized FlatList — cards mount a frame after each
# swipe, so Maestro must wait for the list to settle before re-checking or it
# overshoots a card sitting at the bottom edge (it lands there <30% visible and
# the run times out). waitToSettleTimeoutMs + a lower visibility threshold +
# centerElement make the scroll deterministic.
- scrollUntilVisible:
    element:
      id: "plan-card-.*-title-weekend-brunch"
    direction: DOWN
    speed: 20
    timeout: 30000
    visibilityPercentage: 10
    waitToSettleTimeoutMs: 600
    centerElement: true
- tapOn:
    id: "plan-card-.*-title-weekend-brunch"
- waitForAnimationToEnd

- takeScreenshot: "issue-094-plan-detail"

# Plan detail opens first. Tap "Go to voting" to enter the swipe deck.
# (plan-detail-voting-btn → pushes /group-session?planId=...&autoStart=true)
- tapOn:
    id: "plan-detail-voting-btn"
- waitForAnimationToEnd

- takeScreenshot: "issue-094-entered-swipe"

# autoStart=true skips lobby, goes straight to swiping phase.
# group-session.tsx swiping phase uses accessibilityLabel buttons, not testID buttons.
# (swipe-no-btn/swipe-yes-btn live in swipe.tsx solo mode only.)
- extendedWaitUntil:
    visible: "Pass on restaurant"
    timeout: 15000

- assertVisible: "Like restaurant"
- assertVisible: "Pass on restaurant"

- takeScreenshot: "issue-094-swipe-deck"

# Swipe through all 5 seeded restaurants
# (alternating like/pass to exercise both paths)
- tapOn: "Like restaurant"
- waitForAnimationToEnd

- tapOn: "Pass on restaurant"
- waitForAnimationToEnd

- tapOn: "Like restaurant"
- waitForAnimationToEnd

- tapOn: "Pass on restaurant"
- waitForAnimationToEnd

# Last card — after this, finishSwiping fires and submits votes
- tapOn: "Like restaurant"
- waitForAnimationToEnd

- takeScreenshot: "issue-094-after-all-swipes"

# KEY ASSERTION: Vote submission succeeded. With autoStart bypassing the lobby,
# issue #94 caused submitSwipes to throw on empty restaurantOptions → an
# "Failed to submit votes" alert. The safety net populates restaurantOptions
# first, so submission succeeds and the swipe phase resolves to the post-vote
# confirmation screen ("Your votes are in!" — Maya & Liam still need to finish,
# so the plan does not auto-confirm to a results reveal here).
- extendedWaitUntil:
    visible: "Your votes are in!"
    timeout: 15000

- assertVisible: "Your votes are in!"
# Regression guard: the failure-mode alert must NOT be present.
- assertNotVisible: "Failed to submit votes"
- takeScreenshot: "issue-094-votes-submitted"
