# Fly.io config for the Chewgether backend (#320)
# App name must be globally unique — adjust at `fly launch` if taken.
app = "chewgether-backend"
primary_region = "iad"   # Ashburn, VA — closest to the initial user base

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Always-on: a mobile launch can't afford cold starts.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
