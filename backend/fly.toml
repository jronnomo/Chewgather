# Fly.io config for the Chewgather backend (#320)
# App name must be globally unique — adjust at `fly launch` if taken.
app = "chewgather-backend"
primary_region = "iad"   # Ashburn, VA — closest to the initial user base

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Always-on: a mobile launch can't afford cold starts.
  auto_stop_machines = "off"
  auto_start_machines = true
  # HA (CHE-43): run >= 2 machines on different hosts so one host reboot/OOM/migration
  # doesn't take the API down (CHE-41 SEV1). With auto_stop "off" Fly does not enforce
  # this number — the machine count itself is set at deploy time:
  #   fly scale count 2 -a chewgather-backend   (see PR for the host-placement check)
  min_machines_running = 2

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
